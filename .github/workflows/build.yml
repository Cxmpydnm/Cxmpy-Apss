name: Build Cxmpy Apps NRO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get dependencies
        run: |
          rm -rf vendor/borealis vendor/glm vendor/libnx-ext vendor/zstd
          git clone --depth 1 --branch legacy https://github.com/natinusala/borealis.git vendor/borealis
          git clone --depth 1 https://github.com/g-truc/glm.git vendor/glm
          git clone --depth 1 https://github.com/XorTroll/libnx-ext.git vendor/libnx-ext
          git clone --depth 1 https://github.com/facebook/zstd.git vendor/zstd

      - name: Build Borealis
        run: |
          sed -i '/swkbdConfigSetStringLenMaxExt/d' vendor/borealis/library/lib/swkbd.cpp
          cd vendor/borealis
          make -j2

      - name: Build Cxmpy Apps
        run: |
          make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: CxmpyApps
          path: "*.nro"
