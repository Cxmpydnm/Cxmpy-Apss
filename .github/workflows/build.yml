name: Build Cxmpy Apps NRO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Cxmpy Apps
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: CxmpyApps
          path: "*.nro"
